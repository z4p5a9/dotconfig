# set default-terminal colors to display default terminal colors

set -g default-terminal "xterm-256color"

# set-option -ga terminal-overrides ',xterm-256color:Tc

# Proper colors

set-option -sa terminal-features ',xterm-256color:RGB'

# Undercurl

set-option -g default-terminal "xterm-256color"

set-option -ga terminal-features ",xterm-256color:usstyle"

set -s escape-time 0

set-option -g history-limit 100000

set-window-option -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel

# Status Bar
set-option -g status-position top

set -g status-left-length 52
set-option -g status-right ""

set-option -g status-left "[#S]"
set -g status-left-style fg="#ffffff",bg="#8f0000"

set -g status-bg "#ececec"
set -g status-fg "#424242"

set -g message-style fg="#424242",bg="#ffffff"

set -g window-status-format " #I:#W "
set -g window-status-style fg="#424242",bg="#ececec"
set -g window-status-current-format " #I:#W "
set -g window-status-current-style fg="#424242",bg="#ffffff"

set -g pane-border-style fg="#ececec"
set -g pane-active-border-style fg="#424242"


# Source .tmux.conf as suggested in `man tmux`
bind R source-file ~/.config/tmux/tmux.conf \; display-message "~/.config/tmux/tmux.conf reloaded"

# Start pane and window numbering from 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Enable mouse
set -g mouse on
set -g set-clipboard on

bind c new-window -c "#{pane_current_path}"
bind % split-window -hc "#{pane_current_path}"
bind "\"" split-window -vc "#{pane_current_path}"
bind Space last-window

# ============================
# ==== vim-tmux-navigator ====
# ============================
# Smart pane switching with awareness of Vim splits.
# See: https://github.com/christoomey/vim-tmux-navigator
is_vim="ps -o state= -o comm= -t '#{pane_tty}' \
    | grep -iqE '^[^TXZ ]+ +(\\S+\\/)?g?(view|l?n?vim?x?|fzf)(diff)?$'"
bind-key -n 'C-h' if-shell "$is_vim" 'send-keys C-h'  'select-pane -L'
bind-key -n 'C-j' if-shell "$is_vim" 'send-keys C-j'  'select-pane -D'
bind-key -n 'C-k' if-shell "$is_vim" 'send-keys C-k'  'select-pane -U'
bind-key -n 'C-l' if-shell "$is_vim" 'send-keys C-l'  'select-pane -R'
tmux_version='$(tmux -V | sed -En "s/^tmux ([0-9]+(.[0-9]+)?).*/\1/p")'
if-shell -b '[ "$(echo "$tmux_version < 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\'  'select-pane -l'"
if-shell -b '[ "$(echo "$tmux_version >= 3.0" | bc)" = 1 ]' \
    "bind-key -n 'C-\\' if-shell \"$is_vim\" 'send-keys C-\\\\'  'select-pane -l'"

bind-key -T copy-mode-vi 'C-h' select-pane -L
bind-key -T copy-mode-vi 'C-j' select-pane -D
bind-key -T copy-mode-vi 'C-k' select-pane -U
bind-key -T copy-mode-vi 'C-l' select-pane -R
bind-key -T copy-mode-vi 'C-\' select-pane -l
